<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi casa, poco a poco</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2B418">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3EF; --surface:#FFFFFF; --ink:#1E2B2C; --muted:#5B6B6A; --line:#D3DED8;
  --sun:#F2B418; --sun-ink:#3A2A00; --sun-soft:#FCEFC7; --teal:#12706C; --teal-soft:#D6ECE8;
  --alert:#B7412B; --alert-soft:#F8DED7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#122021; --surface:#1A2B2C; --ink:#E6EFEC; --muted:#9DB0AD; --line:#2B3E3F;
    --sun:#F4C13D; --sun-ink:#2B1F00; --sun-soft:#3A3212; --teal:#56BDB2; --teal-soft:#1E3A39;
    --alert:#F08A73; --alert-soft:#3D2420;
  }
}
:root[data-theme="dark"]{
  --bg:#122021; --surface:#1A2B2C; --ink:#E6EFEC; --muted:#9DB0AD; --line:#2B3E3F;
  --sun:#F4C13D; --sun-ink:#2B1F00; --sun-soft:#3A3212; --teal:#56BDB2; --teal-soft:#1E3A39;
    --alert:#F08A73; --alert-soft:#3D2420;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}
h1{font-size:2.1rem;line-height:1.05;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;margin:0 0 10px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.streak{text-align:right;flex:none}
.streak b{display:block;font-size:2rem;line-height:1;font-weight:800}
.streak span{font-size:.85rem;color:var(--muted)}
.week{display:flex;gap:6px;margin:16px 0 4px}
.day{flex:1;text-align:center;font-size:.8rem;color:var(--muted)}
.dot{width:26px;height:26px;border-radius:50%;margin:4px auto 0;border:2px solid var(--line);background:transparent}
.dot.ok{background:var(--teal);border-color:var(--teal)}
.dot.today{border-color:var(--ink)}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin:18px 0 22px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:999px;font-weight:600;font-size:.94rem;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* Temporizador: el elemento principal */
.start{background:var(--sun);color:var(--sun-ink);border-radius:28px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:26px}
.start .next{font-size:1.45rem;font-weight:800;line-height:1.15;margin-top:4px}
.start small{font-size:.9rem;font-weight:600;opacity:.8}
.dial{position:relative;width:128px;height:128px}
.dial svg{transform:rotate(-90deg)}
.dial .track{stroke:rgba(0,0,0,.14)}
.dial .prog{stroke:var(--sun-ink);transition:stroke-dashoffset .5s linear}
.dial .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.6rem}
.dial .time span{font-size:.72rem;font-weight:600}
.tctl{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px}
.tctl button{border:0;border-radius:999px;padding:11px 18px;font-weight:700;white-space:nowrap;flex:1 1 auto}
.tctl .go{background:var(--sun-ink);color:var(--sun);flex:1}
.tctl .ghost{background:rgba(0,0,0,.1);color:var(--sun-ink)}
.tmsg{grid-column:1 / -1;font-weight:600;font-size:.95rem}
.nomood{grid-column:1 / -1;justify-self:start;border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
/* Modo "no tengo ganas": más suave */
.start.micro{background:var(--teal-soft);color:var(--ink)}
.start.micro .dial .track{stroke:var(--line)}
.start.micro .dial .prog{stroke:var(--teal)}
.start.micro .tctl .go{background:var(--teal);color:var(--bg)}
.start.micro .tctl .ghost{background:var(--surface);color:var(--ink)}
.start.micro.won .next{font-size:1.6rem}

.block{margin-bottom:26px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.list li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list input[type=checkbox]{width:24px;height:24px;accent-color:var(--teal);flex:none;margin:0}
.list label{flex:1;cursor:pointer}
.list li.done label{color:var(--muted);text-decoration:line-through}
.list.rows li{justify-content:space-between}
.list.rows b{font-weight:800;white-space:nowrap}
.del{border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:2px 6px}
.add{display:flex;gap:8px;margin-top:10px}
.add input,.add select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.add button,.btn{border:0;background:var(--teal);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .btn{flex:1 1 auto;white-space:nowrap}
.note{background:var(--teal-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.done-all{background:var(--teal-soft);border-radius:18px;padding:16px;font-weight:600;margin-bottom:26px}

details{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:10px}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary b{font-weight:800}
details[open] summary{border-bottom:1px solid var(--line)}
.dbody{padding:12px 16px 16px}
.dbody .list{border-radius:12px}
.field{display:block;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.field input,.field textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:1rem;color:var(--ink)}
textarea{min-height:84px;resize:vertical;font-size:.85rem!important}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .3s}
.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;padding:6px 0;margin-top:12px}
.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:28px}
.hint{font-size:.9rem;color:var(--muted);margin-top:8px}

/* Progreso */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px}
.stat b{display:block;font-size:2rem;line-height:1;font-weight:800}
.stat span{display:block;font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.25}
.stat.best{background:var(--sun-soft);border-color:transparent}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h2{margin:0}
.calhead button{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;font-size:1.2rem;font-weight:700}
.calhead button:disabled{opacity:.35;cursor:default}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calgrid .dn{text-align:center;font-size:.75rem;color:var(--muted);padding-bottom:2px}
.cd{aspect-ratio:1;border:0;border-radius:10px;background:var(--surface);font-size:.85rem;font-weight:600;padding:0}
.cd.l1{background:var(--teal-soft)}
.cd.l2{background:var(--teal-soft);background:color-mix(in srgb,var(--teal) 45%,var(--surface))}
.cd.l3{background:var(--teal);color:var(--bg)}
.cd.ok{box-shadow:inset 0 0 0 3px var(--sun)}
.cd.sel{outline:2px solid var(--ink);outline-offset:1px}
.cd:disabled{opacity:.35;cursor:default}
.cd.empty{visibility:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:10px 0 14px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.legend .lg1{background:var(--teal)}
.legend .lg2{box-shadow:inset 0 0 0 3px var(--sun);background:var(--surface)}
.daydetail{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.daydetail p{font-weight:700}
.daydetail ul{margin:8px 0 0;padding-left:20px}
.daydetail li{margin:2px 0}

/* Limpieza del apto */
.steps{list-style:none;margin:0 0 14px;padding:0}
.steps details{margin-bottom:8px}
.steps li.cur details{background:var(--sun-soft);border-color:var(--sun)}
.steps summary{justify-content:flex-start;gap:12px}
.stn{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;background:var(--bg);border:2px solid var(--line)}
.stp.cur .stn{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.stp.ok .stn{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.stt{display:flex;flex-direction:column;line-height:1.25}
.stt .muted{font-size:.88rem}
.stp.ok .stt b{color:var(--muted)}
.ezona{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.ezona:first-child{border-top:0;margin-top:0;padding-top:0}
.ezrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ezrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;color:var(--ink);font-weight:700}
.ezmin{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);margin-bottom:10px}
.ezmin input{width:72px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 9px;color:var(--ink)}
.inl{margin:0 0 0 4px;padding:0;color:var(--teal);font-weight:700}
.apnote{margin-bottom:26px}
.visbtn{width:100%;margin-bottom:22px;padding:13px 16px}
.start.visita .vlist{grid-column:1 / -1;color:var(--ink)}
.need li{display:block}
.nrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nst{font-size:.82rem;font-weight:700;color:var(--muted)}
.nst.toca{color:var(--alert)}
.nst.pronto{color:var(--ink);background:var(--sun-soft);padding:1px 8px;border-radius:999px}
.nst.toca{background:var(--alert-soft);padding:1px 8px;border-radius:999px}
.nbar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.nbar i{display:block;height:100%;border-radius:999px}
.nbar i.ok{background:var(--teal)} .nbar i.pronto{background:var(--sun)} .nbar i.toca{background:var(--alert)}
.need .muted{font-size:.85rem}
.ztimer.rest{background:var(--teal-soft);color:var(--ink)}
.ztimer.rest .dial.sm .track{stroke:var(--line)}
.ztimer.rest .dial.sm .prog{stroke:var(--teal)}
.ztimer.rest .zbtns .go{background:var(--teal);color:var(--bg)}
.ztimer.rest .zbtns .ghost{background:var(--surface);color:var(--ink)}
.ezmin{flex-wrap:wrap;column-gap:16px}
.ezmin label{display:flex;align-items:center;gap:8px}
.logros{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.logros li{position:relative;background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:12px 12px 12px 46px;min-height:72px}
.logros li b{display:block;font-size:.95rem;line-height:1.2;color:var(--muted)}
.logros li span:last-child{display:block;font-size:.8rem;color:var(--muted);margin-top:3px;line-height:1.25}
.logros .lck{position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.logros li.got{background:var(--sun-soft);border:1px solid transparent}
.logros li.got b{color:var(--ink)}
.logros li.got .lck{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.dial.sm{width:100px;height:100px}
.dial.sm .time{font-size:1.3rem}
.dial.sm .track{stroke:var(--line)}
.dial.sm .prog{stroke:var(--sun-ink)}
.ztimer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;align-items:center;background:var(--sun);color:var(--sun-ink);border-radius:18px;padding:14px;margin-bottom:12px}
.ztimer .dial.sm .track{stroke:rgba(0,0,0,.14)}
.zbtns{display:flex;flex-direction:column;gap:8px}
.zbtns button{border:0;border-radius:999px;padding:10px 12px;font-weight:700;line-height:1.2}
.zbtns .go{background:var(--sun-ink);color:var(--sun)}
.zbtns .ghost{background:rgba(0,0,0,.1);color:var(--sun-ink)}
.ztimer .tmsg{grid-column:1 / -1;font-size:.92rem;font-weight:600}
@media (max-width:420px){ .start{grid-template-columns:1fr} .dial{margin:0 auto} h1{font-size:1.8rem} .stat b{font-size:1.7rem} }
.tag{font-weight:600;margin:2px 0 4px;max-width:30ch;line-height:1.3}
/* ¿Cómo estás hoy? */
.moods{grid-column:1 / -1;display:grid;gap:8px}
.moods button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px}
.moods button b{font-weight:800;font-size:1.05rem}
.moods button span{font-size:.88rem;color:var(--muted)}
.animochip{margin:-14px 0 22px;font-size:.92rem;color:var(--muted)}
.animochip b{color:var(--ink)}
/* Compañía mientras trabajas */
.comp{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;margin:0}
.comp .dotp{width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.35;flex:none}
.comp .dotp.on{opacity:1;animation:lat 1.6s ease-in-out infinite}
@keyframes lat{50%{transform:scale(1.5);opacity:.5}}
.vozbtn{margin-left:auto;border:0;border-radius:999px;padding:5px 12px;background:rgba(0,0,0,.1);color:inherit;font-weight:700;font-size:.85rem;white-space:nowrap}
.start.micro .vozbtn,.ztimer.rest .vozbtn{background:var(--surface)}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} .comp .dotp.on{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Mi casa, poco a poco</h1>
      <p class="tag">Para cuando sabes lo que hay que hacer, pero no arrancas.</p>
      <p class="muted" id="fecha"></p>
    </div>
    <div class="streak" aria-live="polite"><b id="racha">0</b><span id="rachaTxt">días seguidos</span></div>
  </div>
  <div class="week" id="semanaDots" aria-label="Días cumplidos esta semana"></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="hoy" aria-selected="true">Hoy</button>
    <button role="tab" data-tab="semana" aria-selected="false">Mi semana</button>
    <button role="tab" data-tab="apto" aria-selected="false">Apto</button>
    <button role="tab" data-tab="progreso" aria-selected="false">Progreso</button>
  </div>

  <main id="vista"></main>
  <p class="sync" id="sync">Tu progreso se guarda en este dispositivo.</p>
</div>

<script>
(function(){
const PWA=!!document.querySelector('link[rel="manifest"]');
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MICRO=['Lleva 5 cosas a su lugar','Lava un solo plato o un vaso','Bota la basura que tengas a la vista','Tiende la cama','Despeja una superficie: la mesa o un mesón','Pasa un trapo por el lavamanos','Recoge la ropa que esté en el piso','Guarda los zapatos que estén por ahí','Abre las ventanas y deja entrar aire','Organiza un solo cajón'];
function mk(prefix,arr){return arr.map((t,i)=>({id:prefix+i,t}))}
function base(){return{
  v:1,planV:2,updatedAt:0,
  minimo:mk('m',['Lavar los platos del día','Recoger lo que esté fuera de su lugar (10 min)','Barrer rápido donde más se ensucia']),
  plan:{
    1:{titulo:'Baños',tareas:mk('lu',['Limpiar el inodoro','Lavar lavamanos y espejo','Restregar la ducha','Trapear el piso del baño'])},
    2:{titulo:'Sacudir y ordenar',tareas:mk('ma2',['Sacudir los muebles','Ordenar la habitación'])},
    3:{titulo:'Cocina a fondo',tareas:mk('mi',['Limpiar los mesones','Limpiar la estufa','Limpiar la nevera y botar lo vencido','Sacar la basura'])},
    4:{titulo:'Pisos',tareas:mk('ju',['Barrer toda la casa','Trapear toda la casa'])},
    5:{titulo:'Día libre',tareas:[]},
    6:{titulo:'Lavar la ropa',tareas:mk('sa2',['Poner a lavar la ropa','Lavar sábanas y toallas','Tender la ropa','Doblar y guardar la ropa','Sacar la basura'])},
    0:{titulo:'Descanso',tareas:[]}
  },
  rescate:mk('r',['Sala','Cocina','Habitación','Baño','Zona de ropas','Patio o balcón']).map(z=>({...z,done:false})),
  ajustes:{hora:'18:00',dias:'todos',voz:false},
  apto:aptoBase(),
  visita:{hechas:[],ok:0},
  log:{}
}}
function aptoBase(){
  const z=(id,t,min,arr,piso)=>({id,t,min,piso:!!piso,cada:cadaBase(id),tareas:arr.map((x,i)=>({id:id+'_'+i,t:x}))});
  const cuarto=['Recoger la ropa y lo que esté fuera de lugar','Tender la cama','Sacudir muebles, mesas de noche y repisas','Vaciar la papelera'];
  const bano=['Limpiar el espejo','Lavar el lavamanos y la llave','Restregar la ducha y las paredes','Limpiar el inodoro por dentro y por fuera','Vaciar la papelera'];
  return{zonas:[
    z('pr','Antes de empezar',5,['Abrir las ventanas','Echar limpiador en inodoros y duchas de los dos baños y dejarlo actuar','Juntar en un balde los trapos, guantes y bolsas']),
    z('c1','Cuarto 1',20,cuarto), z('c2','Cuarto 2',20,cuarto),
    z('b1','Baño 1',25,bano), z('b2','Baño 2',25,bano),
    z('co','Cocina',30,['Lavar o guardar la loza','Limpiar la estufa','Limpiar los mesones','Limpiar por fuera la nevera y el microondas','Sacar la basura']),
    z('ba','Barrer',15,['Barrer los cuartos, del fondo hacia la puerta','Barrer baños, cocina y sala','Recoger el polvo y botarlo'],true),
    z('tr','Trapear',20,['Trapear del fondo hacia la puerta, para no pisar lo limpio','Dejar secar con las ventanas abiertas'],true)
  ],hechas:[],inicio:null,finAt:null,historial:[],ultima:{}}}
function cadaBase(id){return id==='pr'?0:({co:4,ba:3}[id]||7)}
function cadaDe(z){return typeof z.cada==='number'?z.cada:cadaBase(z.id)}
const VISITA=['Cerrar las puertas de los cuartos','Recoger lo que está a la vista en la sala y el comedor','Lavamanos e inodoro del baño que van a usar','Poner una toalla limpia en ese baño','Lavar o esconder la loza que se ve','Pasar un trapo por la mesa y los mesones','Sacar la basura','Abrir las ventanas o poner un aroma'];
const LS='mi-casa-v1';
let state=base();
try{const s=localStorage.getItem(LS); if(s) state=normalize(JSON.parse(s));}catch(e){}
let tab='hoy';
let dbRef=null;

function normalize(s){const b=base(); if(!s||typeof s!=='object') return b;
  const planOk=s.planV===2&&s.plan&&typeof s.plan==='object';
  return{v:1,planV:2,updatedAt:s.updatedAt||0,minimo:Array.isArray(s.minimo)?s.minimo:b.minimo,
    plan:planOk?Object.assign(b.plan,s.plan):b.plan,

    apto:(s.apto&&Array.isArray(s.apto.zonas))?Object.assign(b.apto,s.apto,{hechas:Array.isArray(s.apto.hechas)?s.apto.hechas:[],historial:Array.isArray(s.apto.historial)?s.apto.historial:[],ultima:(s.apto.ultima&&typeof s.apto.ultima==='object')?s.apto.ultima:{}}):b.apto,
    visita:(s.visita&&typeof s.visita==='object')?{hechas:Array.isArray(s.visita.hechas)?s.visita.hechas:[],ok:s.visita.ok||0}:b.visita,
    log:(s.log&&typeof s.log==='object')?s.log:{}}}

const p2=n=>String(n).padStart(2,'0');
function key(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function fromKey(k){const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d)}
function hoy(){return new Date()}
function dayLog(k){if(!state.log[k]) state.log[k]={done:[],extra:[]}; const l=state.log[k];
  l.done=l.done||[]; l.extra=l.extra||[]; l.names=l.names||{}; return l}
function peek(k){return state.log[k]||{done:[],extra:[]}}
function cumplidoLive(l){return state.minimo.length>0 && state.minimo.every(m=>(l.done||[]).includes(m.id))}
/* Los días pasados guardan si se cumplieron, así el historial no cambia si luego editas tus tareas */
function cumplido(k){const l=peek(k); if(k!==key(hoy())&&typeof l.ok==='boolean') return l.ok; return cumplidoLive(l)}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function nameOf(id,l){
  const all=[...state.minimo,...Object.values(state.plan).flatMap(p=>p.tareas||[]),...((l&&l.extra)||[]),
    ...state.apto.zonas.flatMap(z=>z.tareas.map(t=>({id:'ap_'+t.id,t:z.t+': '+t.t})))];
  const f=all.find(x=>x.id===id); return f?f.t:null}

let saveT=null;
function save(){state.updatedAt=Date.now();
  const tk=key(hoy()); if(state.log[tk]) state.log[tk].ok=cumplidoLive(state.log[tk]);
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(dbRef){clearTimeout(saveT); saveT=setTimeout(pushDb,700)}}
async function pushDb(){if(!dbRef) return; try{await dbRef.set(JSON.parse(JSON.stringify(state)))}catch(e){}}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtMin(ms){const m=Math.round((ms||0)/60000); if(m<60) return m+' min'; const h=Math.floor(m/60), r=m%60; return h+' h'+(r?' '+r+' min':'')}

function rachaActual(){let c=hoy(); if(!cumplido(key(c))) c.setDate(c.getDate()-1);
  let n=0; while(cumplido(key(c))&&n<3650){n++; c.setDate(c.getDate()-1)} return n}
function mejorRacha(){
  const ks=Object.keys(state.log).filter(k=>/^\d{4}-\d\d-\d\d$/.test(k)).sort(); if(!ks.length) return 0;
  const end=key(hoy()); let d=fromKey(ks[0]), run=0, best=0, g=0;
  while(g++<4000){const k=key(d); if(cumplido(k)){run++; if(run>best) best=run} else if(k!==end) run=0;
    if(k>=end) break; d.setDate(d.getDate()+1)}
  return best}

/* Temporizador: 20 minutos normal, 2 minutos en modo "no tengo ganas" */
const DUR_N=20*60*1000, DUR_M=2*60*1000;
const MSG_N='Cuando suene puedes parar. Lo difícil es empezar.';
const MSG_M='Dos minutos y puedes parar. Si quieres seguir, sigues.';

const DEF={normal:MSG_N,micro:MSG_M,zona:MSG_Z,descanso:MSG_D,visita:MSG_V};
const DUR_D=10*60*1000, DUR_V=15*60*1000;
let mode='normal', microI=0, microDone=false, zonaT=null, ofrecerDesc=false, descFrom='normal', visitaOn=false, visitaFin=false;

  if(mode==='micro') return DUR_M;
  if(mode==='descanso') return DUR_D;
  if(mode==='visita') return DUR_V;
  if(mode==='zona'){const z=state.apto.zonas.find(x=>x.id===zonaT); return (z?z.min:20)*60000}
  return durNormal()}

function durNormal(){return animoHoy()==='medio'?10*60000:DUR_N}

const COMP={
  normal:['Sigo aquí contigo.','Ya arrancaste, y eso era lo más difícil.','Una cosa a la vez. Lo estás haciendo.','No tiene que quedar perfecto, tiene que quedar hecho.','Si te distrajiste, vuelve sin regañarte.','Respira hondo. Vas a tu ritmo.','Cada minuto cuenta, aunque todavía no se note.','Tu yo de mañana te lo va a agradecer.','Mira lo que ya avanzaste. Eso no estaba hecho hace un rato.','No pienses en todo lo que falta. Solo en lo que tienes en las manos.','Vas mejor de lo que crees.','Un poquito más y lo tachas de la lista.','Si te cansaste, baja el ritmo, pero no pares.','Pon una canción que te guste y sigue.','Esto que estás haciendo es cuidarte a ti misma.','Hecho es mejor que perfecto.','Lo estás logrando, de verdad.','Cuando suene, te ganaste un descanso.'],

  visita:['Lo que más se nota, primero.','Vas rápido y vas bien.','Nadie va a revisar los rincones.','Lo que no se ve, puede esperar.','Puertas cerradas y listo. Nadie entra a los cuartos.','Una superficie despejada ya cambia todo.','Vas a recibir con calma, ya verás.'],
  descanso:['Este rato es tuyo. Nada de tareas.','Toma agua, que lo necesitas.','Estira la espalda y los brazos.','Siéntate un momento. Te lo ganaste.','Descansar también es parte del plan.','Respira despacio. No hay afán.','Mira lo que ya hiciste. Está bien sentirse orgullosa.']};
COMP.zona=COMP.normal;
const COMP_CADA=45000;
function fraseComp(){const pool=COMP[mode]||COMP.normal; if(pool.length<2) return pool[0];
  let i; do{i=Math.floor(Math.random()*pool.length)}while(i===compI); compI=i; return pool[i]}
let compI=-1, compAt=0, halfSaid=false, lastSaid=false;
const hayVoz=()=>'speechSynthesis' in window;

    const v=vs.find(x=>/^es[-_](CO|419|MX|US)/i.test(x.lang))||vs.find(x=>/^es/i.test(x.lang));

function timerActivo(){return !!tEnd||(tLeft>0&&tLeft<dur())}

/* Pantalla encendida mientras corre el temporizador */
let wl=null, wlAvisado=false;
async function pantallaOn(){
  if(wl) return;
  try{
    if(!('wakeLock' in navigator)) throw new Error('no');
    wl=await navigator.wakeLock.request('screen');
    wl.addEventListener('release',()=>{wl=null});
    if(!tEnd) pantallaOff();
  }catch(e){
    if(!wlAvisado&&tEnd){wlAvisado=true; setMsg('Ojo: este celular no deja mantener la pantalla encendida. Sube el tiempo de pantalla en Ajustes.')}
  }}
function pantallaOff(){if(wl){try{wl.release()}catch(e){} wl=null}}
function stopRun(){if(!tEnd) return; addFocus(Date.now()-segStart); tLeft=Math.max(0,tEnd-Date.now()); tEnd=null; segStart=null; clearInterval(tInt); tInt=null; pantallaOff()}

function paintTimer(){
  const total=dur(), left=tEnd?tEnd-Date.now():tLeft;
  const tEl=document.getElementById('tiempo'), p=document.getElementById('prog'), go=document.getElementById('tGo');
  if(!tEl) return;

  paintComp();

function beep(){try{if(!actx) return; [0,0.35,0.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.2,actx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.3); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.3)})}catch(e){}}
function tick(){
  if(!tEnd) return;
  const left=tEnd-Date.now();
  if(left<=0){
    addFocus(tEnd-segStart); clearInterval(tInt); tInt=null; tEnd=null; segStart=null; tLeft=dur(); beep(); pantallaOff();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    if(mode==='micro'){const l=dayLog(key(hoy())); l.micro=(l.micro||0)+1; save(); microDone=true; hablar('¡Dos minutos! Lo lograste. Empezar era lo difícil.'); return render()}
    if(mode==='descanso'){mode=descFrom; tLeft=dur(); msgs[mode]='Se acabó el descanso. Cuando quieras, seguimos.'; hablar(msgs[mode]); return render()}
    if(mode==='visita'){msgs.visita='Se acabó el tiempo. Lo que alcanzaste ya se nota.'; hablar(msgs.visita); return render()}
    if(mode==='zona'){const z=state.apto.zonas.find(x=>x.id===zonaT); msgs.zona=`Se acabó el tiempo de ${z?z.t:'esta zona'}. Descansa o termina con calma.`}
    else msgs.normal=`¡Listo, ${Math.round(dur()/60000)} minutos! Ahora te ganaste un descanso.`;
    hablar(msgs[mode]); ofrecerDesc=true; return render();
  }
  if(mode!=='descanso'){const total=dur();
    if(!halfSaid&&total>=4*60000&&left<=total/2){halfSaid=true; compAt=Date.now(); decir('Vas por la mitad. Sigue así.')}
    else if(!lastSaid&&total>=3*60000&&left<=60000){lastSaid=true; compAt=Date.now(); decir('Último minuto. Ya casi terminas.')}

function toggleTimer(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(tEnd) stopRun();
  else{if(tLeft>=dur()){halfSaid=false; lastSaid=false}
    tEnd=Date.now()+tLeft; segStart=Date.now(); compAt=Date.now(); tInt=setInterval(tick,500); ofrecerDesc=false;
    decir({micro:'Solo dos minutos. Puedes con esto.',zona:'Vas bien. Solo esta zona, nada más.',descanso:'Descansando. Nada de tareas ahora.',visita:'Rápido y sin perfección. Tú puedes.'}[mode]||'Vas bien. Solo esta tarea, nada más.'); pantallaOn()}
  paintTimer()}

  apResetArmed=false; if(tab==='progreso'){const t=hoy(); calY=t.getFullYear(); calM=t.getMonth(); selDay=key(t); moveMsg=''; importArmed=false}

const V=document.getElementById('vista');
V.addEventListener('change',e=>{
  const c=e.target.closest('[data-check]');
  if(c){const id=c.dataset.check;
    if(id.startsWith('ap_')){marcarApto(id.slice(3),c.checked); save(); render(); return}
    if(id.startsWith('vi_')){const i=+id.slice(3), V=state.visita, l=dayLog(key(hoy()));
      V.hechas=V.hechas.filter(x=>x!==i); l.done=l.done.filter(x=>x!==id);
      if(c.checked){V.hechas.push(i); l.done.push(id); l.names[id]='Visitas: '+VISITA[i]}
      if(V.hechas.length===VISITA.length&&!visitaFin){visitaFin=true; V.ok=(V.ok||0)+1; stopRun(); msgs.visita='Todo listo. Disfruta la visita.'}
      save(); render(); return}
    if(id.startsWith('z')){const z=state.rescate.find(x=>'z'+x.id===id); if(z) z.done=c.checked}
    else{const l=dayLog(key(hoy())); l.done=l.done.filter(x=>x!==id);
      if(c.checked){l.done.push(id); const n=nameOf(id,l); if(n) l.names[id]=n}}
    save(); render(); return}
  const t=e.target.closest('[data-title]');
  if(t){state.plan[t.dataset.title].titulo=t.value.trim()||DIAS[t.dataset.title]; save(); render(); return}
  if(e.target.dataset.aptitle){const z=state.apto.zonas.find(x=>x.id===e.target.dataset.aptitle); if(z){z.t=e.target.value.trim()||z.t; save(); render()} return}
  if(e.target.dataset.aptcada){const z=state.apto.zonas.find(x=>x.id===e.target.dataset.aptcada); if(z){const v=parseInt(e.target.value,10); z.cada=isNaN(v)?cadaDe(z):Math.min(90,Math.max(0,v)); save(); render()} return}
  if(e.target.dataset.aptmin){const z=state.apto.zonas.find(x=>x.id===e.target.dataset.aptmin); if(z){z.min=Math.min(240,Math.max(1,parseInt(e.target.value,10)||z.min)); if(mode==='zona'&&zonaT===z.id&&!tEnd) tLeft=dur(); save(); render()} return}
  if(e.target.id==='recHora'){state.ajustes.hora=e.target.value||'18:00'; save(); render(); return}
  if(e.target.id==='recDias'){state.ajustes.dias=e.target.value; save(); render(); return}
});
function marcarApto(tid,on){
  const A=state.apto, l=dayLog(key(hoy())), did='ap_'+tid, z=A.zonas.find(x=>x.tareas.some(t=>t.id===tid)), zonaAntes=z&&zonaHecha(z);
  if(on){
    if(!A.hechas.length) A.inicio=Date.now();
    if(!A.hechas.includes(tid)) A.hechas.push(tid);
    if(!l.done.includes(did)) l.done.push(did);
    const t=z&&z.tareas.find(x=>x.id===tid); if(t) l.names[did]=z.t+': '+t.t;
    if(z&&!zonaAntes&&zonaHecha(z)){skipKeep='az_'+z.id;
      if(mode==='zona'&&zonaT===z.id){stopRun(); const n=zonaActual();
        if(n){zonaT=n.id; tLeft=dur(); msgs.zona=`¡${z.t} lista! Descansa un rato o sigue con ${n.t}.`; ofrecerDesc=true} else msgs.zona=MSG_Z}
      A.ultima=A.ultima||{}; A.ultima[z.id]=Date.now()}
    if(aptoCompleto()&&!A.finAt){A.finAt=Date.now(); A.historial.push({fin:A.finAt,ms:A.finAt-(A.inicio||A.finAt),dias:diasEntre(A.inicio||A.finAt,A.finAt)})}
  } else {
    A.hechas=A.hechas.filter(x=>x!==tid); l.done=l.done.filter(x=>x!==did);
    if(A.finAt){const h=A.historial[A.historial.length-1]; if(h&&h.fin===A.finAt) A.historial.pop(); A.finAt=null}
  }
}
function addFrom(input,fn){const v=(input.value||'').trim(); if(!v) return; fn(v); save(); render()}
V.addEventListener('click',async e=>{
  const el=e.target;
  const ab=el.closest('[data-animo]');
  if(ab){const v=ab.dataset.animo; dayLog(key(hoy())).animo=v; save(); setMode(v==='bajo'?'micro':'normal'); microI=0; return render()}
  if(el.id==='animoCambiar'){const l=dayLog(key(hoy())); delete l.animo; save(); setMode('normal'); return render()}
  if(el.id==='vozBtn'){state.ajustes.voz=!state.ajustes.voz; save();
    el.setAttribute('aria-pressed',state.ajustes.voz?'true':'false'); el.textContent='Voz: '+(state.ajustes.voz?'sí':'no');
    if(state.ajustes.voz) hablar('Listo. Te acompaño con voz.'); else if(hayVoz()) speechSynthesis.cancel();
    return}
  if(el.id==='tGo') return toggleTimer();
  if(el.id==='tReset'){stopRun(); tLeft=dur(); setMsg(DEF[mode]); return paintTimer()}
  if(el.id==='tDesc'){descFrom=mode==='zona'?'zona':'normal'; setMode('descanso'); toggleTimer(); return render()}
  if(el.id==='tSkip'){stopRun(); mode=descFrom; tLeft=dur(); msgs[mode]='Descanso terminado. Cuando quieras, seguimos.'; return render()}
  if(el.id==='vStart'){visitaOn=true; visitaFin=false; state.visita.hechas=[]; setMode('visita'); save(); toggleTimer(); render(); return window.scrollTo(0,0)}
  if(el.id==='vFin'){visitaOn=false; setMode('normal'); return render()}
  if(el.id==='tMicro'){setMode('micro'); microI=0; return render()}
  if(el.id==='tOtra'){stopRun(); tLeft=dur(); microI++; return render()}
  if(el.id==='tVolver'||el.id==='mBasta'){setMode('normal'); return render()}
  if(el.id==='mSeguir'){setMode('normal'); render(); return toggleTimer()}
  if(el.id==='icsBtn') return bajarIcs();
  if(el.id==='instalarBtn'&&deferredInstall){deferredInstall.prompt(); try{await deferredInstall.userChoice}catch(x){} deferredInstall=null; return render()}
  if(el.id==='exportBtn'){const ta=document.getElementById('exportTxt'), txt=JSON.stringify(state);
    ta.hidden=false; ta.value=txt; ta.focus(); ta.select();
    let ok=false; try{await navigator.clipboard.writeText(txt); ok=true}catch(x){}
    document.getElementById('moveMsg').textContent=ok?'Copiado. Ahora pégalo en la otra app, en «Pegar datos copiados».':'Selecciona todo el texto de arriba y cópialo.'; return}
  if(el.id==='importBtn'){const raw=(document.getElementById('importTxt').value||'').trim(); let obj=null;
    try{obj=JSON.parse(raw)}catch(x){}
    if(!obj||typeof obj!=='object'||(!obj.plan&&!obj.log)){importArmed=false; document.getElementById('moveMsg').textContent='Esos datos no se reconocen. Copia el texto completo otra vez.'; el.textContent='Cargar estos datos'; return}
    if(!importArmed){importArmed=true; el.textContent='Sí, reemplazar mis datos'; document.getElementById('moveMsg').textContent='Esto reemplaza lo que hay en este dispositivo. Toca el botón otra vez para confirmar.'; return}
    state=normalize(obj); importArmed=false; moveMsg='Listo, tus datos ya están aquí.'; save(); render(); moveMsg=''; return}
  if(el.id==='extraBtn') return addFrom(document.getElementById('extraIn'),v=>dayLog(key(hoy())).extra.push({id:uid(),t:v}));
  if(el.id==='zonaBtn') return addFrom(document.getElementById('zonaIn'),v=>state.rescate.push({id:uid(),t:v,done:false}));
  if(el.id==='apNueva'){Object.assign(state.apto,{hechas:[],inicio:null,finAt:null}); apResetArmed=false; save(); return render()}
  if(el.id==='apReset'){if(!apResetArmed){apResetArmed=true; return render()} apResetArmed=false; Object.assign(state.apto,{hechas:[],inicio:null,finAt:null}); save(); return render()}
  if(el.id==='apZonaBtn') return addFrom(document.getElementById('apZonaIn'),v=>{const Z=state.apto.zonas, i=Z.findIndex(z=>z.piso); Z.splice(i<0?Z.length:i,0,{id:uid(),t:v,min:20,piso:false,tareas:[]})});
  if(el.id==='zonaReset'){state.rescate.forEach(z=>z.done=false); save(); return render()}
  const d=el.closest('button'); if(!d) return;
  if(d.dataset.goto){tab=d.dataset.goto; render(); return window.scrollTo(0,0)}
  if(d.dataset.delzap){const A=state.apto, z=A.zonas.find(x=>x.id===d.dataset.delzap); if(z){const ids=z.tareas.map(t=>t.id); A.hechas=A.hechas.filter(x=>!ids.includes(x)); A.zonas=A.zonas.filter(x=>x!==z)} save(); return render()}
  if(d.dataset.delap){const [zid,tid]=d.dataset.delap.split('|'), z=state.apto.zonas.find(x=>x.id===zid); if(z) z.tareas=z.tareas.filter(t=>t.id!==tid); state.apto.hechas=state.apto.hechas.filter(x=>x!==tid); save(); return render()}
  if(d.dataset.cal){calM+=Number(d.dataset.cal); if(calM<0){calM=11;calY--} if(calM>11){calM=0;calY++} return render()}
  if(d.dataset.dia){selDay=d.dataset.dia; return render()}
  if(d.dataset.delextra){const l=dayLog(key(hoy())); l.extra=l.extra.filter(x=>x.id!==d.dataset.delextra); l.done=l.done.filter(x=>x!==d.dataset.delextra); save(); return render()}
  if(d.dataset.delzona){state.rescate=state.rescate.filter(z=>z.id!==d.dataset.delzona); save(); return render()}
  if(d.dataset.delmin){state.minimo=state.minimo.filter(m=>m.id!==d.dataset.delmin); save(); return render()}
  if(d.dataset.deltask){const [i,id]=d.dataset.deltask.split('|'); state.plan[i].tareas=state.plan[i].tareas.filter(t=>t.id!==id); save(); return render()}
  if(d.dataset.addbtn){const w=d.dataset.addbtn, inp=V.querySelector(`[data-addin="${w}"]`);
    return addFrom(inp,v=>{ if(w==='min') state.minimo.push({id:uid(),t:v});
      else if(w.startsWith('ap:')){const z=state.apto.zonas.find(x=>x.id===w.slice(3)); if(z) z.tareas.push({id:uid(),t:v})}
      else state.plan[w].tareas.push({id:uid(),t:v}) })}
});
V.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT') return;
  const btn=e.target.closest('.add')?.querySelector('button'); if(btn){e.preventDefault(); btn.click()}
  else if(e.target.dataset.title!==undefined||e.target.dataset.aptitle!==undefined||e.target.dataset.aptmin!==undefined) e.target.blur()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){ if(tEnd){tick(); if(tEnd) pantallaOn()} renderHeader(); }});

render();

(async()=>{try{
  if(!window.claude||typeof window.claude.use!=='function') return;
  const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
  if(!user||!db) return;
  const id=await user.id(); if(!id) return;
  dbRef=db.doc('data/users/'+id+'/casa');
  const snap=await dbRef.get();
  if(snap.exists){const d=JSON.parse(JSON.stringify(snap.data()||{}));
    if((d.updatedAt||0)>(state.updatedAt||0)){state=normalize(d); try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){} render()}
    else if(state.updatedAt>(d.updatedAt||0)) pushDb();
  } else if(state.updatedAt) pushDb();
  document.getElementById('sync').textContent='Tu progreso se guarda en tu cuenta y lo ves desde cualquier dispositivo.';
}catch(e){}})();
})();
